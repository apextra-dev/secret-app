name: secret
description: "Simple messenger"
publish_to: 'none' 
version: 0.1.5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0
  firebase_auth: ^6.7.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  flutter_launcher_icons: ^0.14.4
  firebase_messaging: ^16.7.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  flutter_svg: ^2.3.0
  equatable: ^3.0.0
  rxdart: ^0.28.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon/app_icon.jpg'

flutter:

  uses-material-design: true

  assets:
    - assets/images/app_icon/
    - assets/images/settings/
    - assets/images/auth/
    - assets/images/nav/
    - assets/images/partner_profile/
    - assets/images/chat/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Rajdhani-Regular
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf

